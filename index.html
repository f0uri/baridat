<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0c29" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>بريدات — صندوق بريد مؤقت</title>
    <link rel="preconnect" href="https://api.mail.tm" />
  </head>
  <body>
    <div class="bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
    </div>

    <div id="app" class="app">
      <!-- Toast -->
      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <!-- Update notification (OTA) -->
      <div id="updateBanner" class="update-banner glass" hidden>
        <span>يتوفر تحديث جديد</span>
        <button id="updateBtn" class="btn-update">تحديث الآن</button>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar glass" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon">✉</div>
            <div class="logo-text">
              <h1>بريدات</h1>
              <span>Temp Mail</span>
            </div>
          </div>
        </div>

        <button id="newEmailBtn" class="btn-new">
          <span class="btn-icon">＋</span>
          بريد جديد
        </button>

        <div class="sidebar-section-title">صناديق البريد</div>
        <div id="emailList" class="email-list"></div>

        <div class="sidebar-footer">
          <button id="settingsBtn" class="btn-icon-only" title="الإعدادات">⚙</button>
          <a id="downloadApk" class="btn-icon-only" title="تحميل APK" href="/baridat.apk" download style="display:grid;place-items:center;text-decoration:none;color:var(--text);">📥</a>
          <div class="version" id="versionBadge">v1.2.0</div>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <!-- Current email bar -->
        <header class="email-bar glass">
          <button id="menuBtn" class="menu-btn" aria-label="القائمة">☰</button>
          <div class="current-email">
            <div class="email-label">بريدك الحالي</div>
            <div class="email-address" id="currentAddress">—</div>
          </div>
          <div class="email-actions">
            <button id="copyBtn" class="action-btn" title="نسخ البريد">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button id="refreshBtn" class="action-btn" title="تحديث">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button id="changeBtn" class="action-btn" title="تغيير البريد">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H7"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h14"/></svg>
            </button>
            <button id="deleteBtn" class="action-btn danger" title="حذف هذا البريد">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </header>

        <!-- Messages -->
        <section class="messages-wrap">
          <div id="messagesList" class="messages-list"></div>
          <div id="emptyState" class="empty-state">
            <div class="empty-icon">📭</div>
            <h3>لا توجد رسائل بعد</h3>
            <p>سيظهر أي بريد يُرسَل إلى عنوانك هنا تلقائيًا</p>
            <div class="loader" id="loader"></div>
          </div>
        </section>

        <!-- Message detail modal -->
        <div id="messageModal" class="modal-backdrop" hidden>
          <div class="modal glass">
            <div class="modal-header">
              <button id="closeModal" class="close-btn">✕</button>
              <div class="modal-subject" id="modalSubject">—</div>
            </div>
            <div class="modal-meta">
              <div><strong>من:</strong> <span id="modalFrom">—</span></div>
              <div><strong>إلى:</strong> <span id="modalTo">—</span></div>
              <div><strong>التاريخ:</strong> <span id="modalDate">—</span></div>
            </div>
            <div class="modal-attachments" id="modalAttachments"></div>
            <div class="modal-body">
              <iframe id="modalIframe" sandbox="allow-same-origin"></iframe>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

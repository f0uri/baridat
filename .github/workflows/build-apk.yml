name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Copy static assets (public) into dist/ so they get packaged as android_asset
        run: |
          cp public/icon-192.png dist/icon-192.png
          cp public/icon-512.png dist/icon-512.png
          cp public/icon.svg dist/icon.svg
          cp public/manifest.webmanifest dist/manifest.webmanifest
          cp public/sw.js dist/sw.js
          cp public/version.json dist/version.json
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf 'sdk.dir=%s\n' "${sdk_root}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Download web artifact into app/src/main/assets/
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/src/main/assets/
      - name: Verify asset structure
        run: |
          ls -la app/src/main/assets/
          ls app/src/main/assets/assets/ 2>/dev/null
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/version.json

      - name: Build (generate) debug keystore if no signing secret
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ ! -f signing/baridat.jks ]; then
            mkdir -p signing
            keytool -genkeypair -v -keystore signing/baridat.jks \
              -storepass baridat2026 -alias baridat -keypass baridat2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Baridat, O=Baridat, C=MA"
          fi

      - name: Import stable signing key (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BARIDAT_SIGNING_BUNDLE_B64: ${{ secrets.BARIDAT_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${BARIDAT_SIGNING_BUNDLE_B64}" ]; then
            echo "::error::BARIDAT_SIGNING_BUNDLE_B64 is required for tag builds"
            exit 1
          fi
          mkdir -p signing
          echo "$BARIDAT_SIGNING_BUNDLE_B64" | base64 -d > /tmp/key-bundle.pem
          # The bundle is key PEM + cert PEM concatenated; split them.
          awk 'BEGIN{c=0} /-----BEGIN/{c++; f="/tmp/baridat-"c".pem"} {print > f}' /tmp/key-bundle.pem
          # First PEM block is the key, second is the cert.
          # The key may be encrypted or plain. Try no password first.
          if openssl pkcs12 -export \
               -in /tmp/baridat-2.pem -inkey /tmp/baridat-1.pem \
               -out /tmp/baridat.p12 -name baridat \
               -passout pass:baridat2026 2>/dev/null; then
            echo "Imported with unencrypted key."
          elif openssl pkcs12 -export \
               -in /tmp/baridat-2.pem -inkey /tmp/baridat-1.pem \
               -out /tmp/baridat.p12 -name baridat \
               -passout pass:baridat2026 -passin pass:baridat2026; then
            echo "Imported with encrypted key."
          else
            echo "::error::Failed to convert PEM to PKCS12 (key may be encrypted with a different password)."
            exit 1
          fi
          keytool -importkeystore \
            -srckeystore /tmp/baridat.p12 -srcstoretype PKCS12 -srcstorepass baridat2026 -srcalias baridat \
            -destkeystore signing/baridat.jks -deststorepass baridat2026 -destalias baridat -destkeypass baridat2026 \
            -noprompt
          echo "Stable signing key imported."
          # Print cert fingerprint for verification
          keytool -list -v -keystore signing/baridat.jks -storepass baridat2026 -alias baridat | grep -E "Alias|SHA-256|MD5"

      - name: Build release APK (tag) or debug APK (branch)
        id: build
        run: |
          set -o pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VARIANT=release
          else
            VARIANT=debug
          fi
          echo "variant=${VARIANT}" >> "$GITHUB_OUTPUT"
          gradle :app:assemble${VARIANT^} --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          if [ "${VARIANT}" = "release" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          ls -la "${APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baridat-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="${{ steps.build.outputs.apk }}"
          test -f "${APK}"
          test -s "${APK}"
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt" dump badging "${APK}" | head -20
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify --verbose "${APK}" | head -20

      - name: Prepare release asset (stable name)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/release-assets
          cp "${{ steps.build.outputs.apk }}" /tmp/release-assets/baridat.apk

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-assets/baridat.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}

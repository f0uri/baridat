name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Copy APK (if present) & version.json to dist
        run: |
          cp public/version.json dist/
          ls -la dist/

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Upload web build artifact (for APK build)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --break-system-packages cryptography pyasn1 pyasn1_modules

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Build APK
        run: |
          cd apk-build
          python3 mkapk.py
          ls -la ../baridat.apk
          mv ../baridat.apk ../baridat-v${GITHUB_REF_NAME#v}.apk 2>/dev/null || cp ../baridat.apk ../baridat.apk
          ls -la ..

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baridat-apk
          path: baridat.apk

      - name: Create Release & upload APK (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: baridat.apk
          generate_release_notes: true
          body: |
            ## ✨ بريدات — Baridat
            تحديث جديد لتطبيق البريد المؤقت بواجهة زجاجية عائمة.

            ### التحميل
            - **baridat.apk** أسفل هذه الصفحة — ملف تثبيت الأندرويد.
            - أو ثبّت كـ PWA من الموقع.

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0414" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4efff" media="(prefers-color-scheme: light)">
<title>بريدات</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
  <div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div>
  <div class="orb o1"></div><div class="orb o2"></div>

  <header class="nb" id="nb"><span id="nt">الوارد</span></header>

  <main id="view"></main>

  <nav class="tabs" aria-label="التنقل">
    <button class="on" data-tab="0">
      <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3-2-6-2 3H2"/><path d="M5.44 5.44 2 12l3.44 6.56A2 2 0 0 0 7.24 19.7h9.52a2 2 0 0 0 1.8-1.14L22 12l-3.44-6.56A2 2 0 0 0 16.76 4.3H7.24a2 2 0 0 0-1.8 1.14z"/></svg>
      الوارد<b class="bd" id="bd"></b>
    </button>
    <button data-tab="1">
      <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>
      العناوين
    </button>
    <button data-tab="2">
      <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      الإعدادات
    </button>
  </nav>

  <div id="scrim" data-act="close"></div>

  <section id="sheet" aria-label="تفاصيل">
    <div class="gr" id="gr"><i class="hd"></i></div>
    <div id="sc"></div>
  </section>

  <div id="updateBanner" class="ub" hidden>
    <span class="ub-ic">
      <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </span>
    <span class="ub-txt">يتوفر إصدار جديد</span>
    <button id="updateBtn" class="ub-btn">تحديث</button>
    <button id="updateClose" class="ub-x" aria-label="إغلاق">
      <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div id="toast"><span id="tt"></span></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>

name: Release diagnostics
on:
  pull_request:
    paths: ['.github/workflows/release-diagnostics.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report failed verification output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view 43763298140 --log-failed | tail -35 | while IFS= read -r line; do echo "::notice::$line"; done

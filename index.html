<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b20">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<title>بريدات — بريد مؤقت</title>
</head>
<body>
<div id="app">
  <div id="updateBanner" class="ub" role="status"><span class="ub-txt">يتوفر إصدار جديد</span><button id="updateBtn">تحديث</button><button id="updateClose" aria-label="إغلاق">×</button></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <main id="view" class="ent">
    <div class="lt"><div><div class="eyebrow">GUERRILLA MAIL</div><h1>بريدات <span>✦</span></h1></div><span class="private-label">بريد مؤقت</span></div>
    <section class="hero">
      <div class="hl"><span id="statusDot" class="live"></span><span id="statusText" role="status">جاري الاتصال…</span></div>
      <div class="hero-label">عنوان بريدك المؤقت</div><div id="address" class="addr" dir="ltr"></div>
      <div class="domain-control"><label for="domainSelect">نطاق البريد</label><select id="domainSelect" dir="ltr" aria-label="نطاق البريد"></select></div>
      <p class="hero-note">عنوان جاهز لاستقبال رسائلك، بدون بريدك الشخصي.</p>
      <div class="acts">
        <button id="copyAddress" class="pill pr">⧉ نسخ البريد</button>
        <button id="random" class="pill">↻ تغيير عشوائي</button>
        <button id="custom" class="pill">✎ تخصيص الاسم</button>
        <button id="refresh" class="pill">⟳ تحديث الوارد</button>
      </div>
    </section>
    <div class="sh"><span>صندوق الوارد</span><b id="counter">0</b></div>
    <div id="list" class="grp"></div>
    <p class="ft">يُفحص الوارد كل ٦ ثوانٍ أثناء فتح التطبيق. قد يتوقف الفحص في الخلفية عند إغلاق التطبيق أو تقييد النظام له. هذا البريد مؤقت وغير خاص.</p>
  </main>
  <div id="scrim"></div>
  <section id="sheet" class="glass" aria-label="تفاصيل الرسالة"><div class="gr"><i></i></div><div id="sc"></div></section>
  <div id="toast" role="status"><span id="tt"></span></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>

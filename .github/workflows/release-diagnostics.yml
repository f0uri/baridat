name: Release diagnostics
on:
  pull_request:
    paths: ['.github/workflows/release-diagnostics.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report failed verification output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          log=$(gh run view 43763298140 --log | grep -A 50 "Verify version and signing continuity" | tail -25 | base64 -w0)
          echo "::notice::$log"

name: Flutter validation
on:
  push:
    branches: ['arena/f811e232-baridat']
  pull_request:
    paths: ['lib/**', 'android/**', 'pubspec.yaml', '.github/workflows/flutter-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.8'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk

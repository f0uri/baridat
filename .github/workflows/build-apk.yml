name: Build Flutter APK & Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Import stable signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BARIDAT_SIGNING_BUNDLE_B64: ${{ secrets.BARIDAT_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$BARIDAT_SIGNING_BUNDLE_B64"
          mkdir -p android/signing
          echo "$BARIDAT_SIGNING_BUNDLE_B64" | base64 -d > /tmp/key-bundle.pem
          awk 'BEGIN{c=0} /-----BEGIN/{c++; f="/tmp/baridat-"c".pem"} {print > f}' /tmp/key-bundle.pem
          if openssl pkcs12 -export -in /tmp/baridat-2.pem -inkey /tmp/baridat-1.pem -out /tmp/baridat.p12 -name baridat -passout pass:baridat2026 2>/dev/null; then
            echo 'Signing key imported.'
          else
            openssl pkcs12 -export -in /tmp/baridat-2.pem -inkey /tmp/baridat-1.pem -out /tmp/baridat.p12 -name baridat -passout pass:baridat2026 -passin pass:baridat2026
          fi
          keytool -importkeystore -srckeystore /tmp/baridat.p12 -srcstoretype PKCS12 -srcstorepass baridat2026 -srcalias baridat -destkeystore android/signing/baridat.jks -deststorepass baridat2026 -destalias baridat -destkeypass baridat2026 -noprompt
      - run: flutter build apk --release
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -20
          mkdir -p release-assets
          cp "$APK" release-assets/baridat.apk
      - name: Verify version and signing continuity for v2.8.2
        if: github.ref == 'refs/tags/v2.8.2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=release-assets/baridat.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          badging=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$badging" | grep -F "package: name='com.baridat.app' versionCode='35' versionName='2.8.2'"
          mkdir -p /tmp/previous-release
          gh release download v2.8.1 --pattern baridat.apk --dir /tmp/previous-release
          old_cert=$("$BUILD_TOOLS/apksigner" verify --print-certs /tmp/previous-release/baridat.apk | grep '^Signer #1 certificate SHA-256 digest:' | head -1)
          new_cert=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep '^Signer #1 certificate SHA-256 digest:' | head -1)
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          echo "APK package, version and signing certificate verified against v2.8.1."
      - uses: actions/upload-artifact@v4
        with:
          name: baridat-apk
          path: release-assets/baridat.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-assets/baridat.apk
          name: ${{ github.ref_name }}

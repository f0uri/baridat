<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<title>بريدات — بريد مؤقت</title>
</head>
<body>
<div id="app">
  <div id="updateBanner" class="ub" role="status"><span class="ub-txt">يتوفر إصدار جديد</span><button id="updateBtn">تحديث</button><button id="updateClose" aria-label="إغلاق">×</button></div>
  <div class="bl b1"></div><div class="bl b2"></div>
  <main id="view" class="ent">
    <div class="lt"><h1>الوارد</h1><button id="refresh" class="ib" aria-label="تحديث الوارد">↻</button></div>
    <section class="hero">
      <div class="hl"><span id="statusDot" class="live"></span><span id="statusText" role="status">جاري الاتصال…</span></div>
      <div id="address" class="addr" dir="ltr"></div>
      <div class="domain-control"><label for="domainSelect">النطاق</label><select id="domainSelect" dir="ltr" aria-label="نطاق البريد"></select></div>
      <div class="acts">
        <button id="copyAddress" class="pill pr"><span>⧉</span> نسخ</button>
        <button id="random" class="pill"><span>↻</span> عنوان جديد</button>
        <button id="custom" class="pill"><span>✎</span> تخصيص</button>
      </div>
    </section>
    <div class="sh"><span>الرسائل</span><b id="counter">0</b></div>
    <div id="list" class="grp"></div>
    <p class="ft">يُفحص الوارد كل ٦ ثوانٍ أثناء فتح التطبيق. قد يتوقف الفحص في الخلفية. هذا البريد مؤقت وغير خاص.</p>
  </main>
  <section id="settingsView" hidden>
    <div class="lt"><h1>الإعدادات</h1></div>
    <div class="sh"><span>التفضيلات</span></div>
    <div class="grp"><div class="settings-row"><span class="ic">♫</span><span class="settings-label">أصوات النقرات<small>صوت خفيف عند الضغط</small></span><button id="soundToggle" class="sw" role="switch" aria-label="أصوات النقرات" aria-checked="true"></button></div></div>
    <div class="sh"><span>حول التطبيق</span></div>
    <div class="grp"><div class="settings-row"><span class="ic">ⓘ</span><span class="settings-label">الإصدار<small id="appVersion">بريدات</small></span></div><button class="settings-row" id="checkUpdate"><span class="ic">↓</span><span class="settings-label">فحص التحديثات<small>التنزيل داخل التطبيق على أندرويد</small></span><span class="chevron">‹</span></button></div>
    <p class="ft">التحديث يمر عبر مثبّت أندرويد ويتطلب تأكيدك.</p>
  </section>
  <nav class="tabs" aria-label="التنقل"><button id="inboxTab" class="on" aria-current="page"><span class="tab-icon">✉</span>الوارد</button><button id="settingsTab"><span class="tab-icon">⚙</span>الإعدادات</button></nav>
  <div id="scrim"></div>
  <section id="sheet" aria-label="تفاصيل الرسالة"><div class="gr"><i></i></div><div id="sc"></div></section>
  <div id="toast" role="status"><span id="tt"></span></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>

name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Copy version.json to dist
        run: cp public/version.json dist/version.json
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install cryptography pyasn1 pyasn1-modules
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/
      - name: List files (debug)
        run: ls -la dist/ && ls -la apk-build/
      - name: Build APK
        run: |
          cd apk-build
          python3 mkapk.py
          ls -la ../baridat.apk
          cd ..
          cp baridat.apk baridat-${GITHUB_REF_NAME#v}.apk || true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baridat-apk
          path: baridat.apk
      - name: Create Release & upload APK (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: baridat.apk
          generate_release_notes: true
          body: |
            ## ✨ بريدات — Baridat
            تحديث جديد لتطبيق البريد المؤقت.

            **baridat.apk** مرفق أسفل الصفحة.

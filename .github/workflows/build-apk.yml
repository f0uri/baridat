name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Copy static assets (public) into dist/ so they get packaged as android_asset
        run: |
          cp public/icon-192.png dist/icon-192.png
          cp public/icon-512.png dist/icon-512.png
          cp public/icon.svg dist/icon.svg
          cp public/manifest.webmanifest dist/manifest.webmanifest
          cp public/sw.js dist/sw.js
          cp public/version.json dist/version.json
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf 'sdk.dir=%s\n' "${sdk_root}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Download web artifact into app/src/main/assets/
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/src/main/assets/
      - name: Verify asset structure
        run: |
          ls -la app/src/main/assets/
          ls app/src/main/assets/assets/ 2>/dev/null
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/version.json

      - name: Prepare signing keys
        env:
          BARIDAT_SIGNING_BUNDLE_B64: ${{ secrets.BARIDAT_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p signing
          # Generate a debug keystore (Gradle usually auto-generates this, but we
          # do it explicitly to ensure deterministic location/password).
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi
          if [ -n "${BARIDAT_SIGNING_BUNDLE_B64}" ]; then
            echo "$BARIDAT_SIGNING_BUNDLE_B64" | base64 -d > /tmp/key-bundle.pem
            awk 'BEGIN{c=0} /-----BEGIN/{c++; f="/tmp/baridat-"c".pem"} {print > f}' /tmp/key-bundle.pem
            if openssl pkcs12 -export \
                 -in /tmp/baridat-2.pem -inkey /tmp/baridat-1.pem \
                 -out /tmp/baridat.p12 -name baridat \
                 -passout pass:baridat2026 2>/dev/null; then
              echo "Imported with unencrypted key."
            elif openssl pkcs12 -export \
                 -in /tmp/baridat-2.pem -inkey /tmp/baridat-1.pem \
                 -out /tmp/baridat.p12 -name baridat \
                 -passout pass:baridat2026 -passin pass:baridat2026; then
              echo "Imported with encrypted key."
            else
              echo "WARNING: key conversion failed, falling back to debug keystore."
              exit 0
            fi
            keytool -importkeystore \
              -srckeystore /tmp/baridat.p12 -srcstoretype PKCS12 -srcstorepass baridat2026 -srcalias baridat \
              -destkeystore signing/baridat.jks -deststorepass baridat2026 -destalias baridat -destkeypass baridat2026 \
              -noprompt
            echo "Stable signing key imported."
            keytool -list -v -keystore signing/baridat.jks -storepass baridat2026 -alias baridat | grep -E "Alias|SHA-256|MD5"
          else
            echo "No stable key available — debug APK will be signed with debug keystore."
          fi

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          ls -la "${APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baridat-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="${{ steps.build.outputs.apk }}"
          test -f "${APK}"
          test -s "${APK}"
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt" dump badging "${APK}" | head -20
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify --verbose "${APK}" | head -20

      - name: Prepare release asset (stable name)
        run: |
          mkdir -p /tmp/release-assets
          cp "${{ steps.build.outputs.apk }}" /tmp/release-assets/baridat.apk

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-assets/baridat.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}

      - name: Upload debug APK to release (branch/tag)
        if: startsWith(github.ref, 'refs/tags/v') == false && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-assets/baridat.apk
          tag_name: latest
          name: Latest build (main)
          prerelease: true

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#120f1f" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <title>بريدات — بريد مؤقت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- Scrim (backdrop) -->
  <div id="scrim" class="scrim" hidden></div>

  <!-- Drawer -->
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <svg class="drawer-logo" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <div>
        <div class="drawer-title">بريدات</div>
        <div class="drawer-sub">صندوق مؤقت</div>
      </div>
    </div>
    <div class="drawer-section-title">عناويني</div>
    <div id="addressList" class="address-list"></div>
    <button id="newAddressBtn" class="btn btn-primary btn-block">+ عنوان جديد</button>
    <div class="drawer-spacer"></div>
    <div class="drawer-foot">
      <button id="settingsBtn" class="btn btn-ghost btn-block">الإعدادات</button>
      <div class="version" id="versionBadge">…</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="القائمة">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div class="topbar-title">بريدات</div>
      <div class="spacer"></div>
      <button id="refreshBtn" class="icon-btn" aria-label="تحديث">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </header>

    <section class="card address-card">
      <div class="label">عنوانك الحالي</div>
      <div class="address-row">
        <div id="currentAddress" class="address">جاري الإنشاء…</div>
        <button id="copyBtn" class="btn btn-ghost btn-sm">نسخ</button>
      </div>
      <div id="addressError" class="error-msg" hidden></div>
      <div class="actions">
        <button id="refreshAddressBtn" class="btn btn-sm">تحديث الصندوق</button>
        <button id="deleteAddressBtn" class="btn btn-sm btn-danger">حذف العنوان</button>
      </div>
    </section>

    <section class="card messages-card">
      <div class="card-head">
        <div class="label">الرسائل</div>
        <div id="providerLabel" class="provider-chip">…</div>
      </div>
      <div id="messages" class="messages"></div>
      <div id="emptyMsg" class="empty">لا توجد رسائل بعد. انتظر قليلاً أو أرسل رسالة إلى هذا العنوان.</div>
    </section>
  </main>

  <!-- Message modal -->
  <div id="msgModal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <button id="closeModal" class="icon-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div id="mSubject" class="modal-title">—</div>
      </div>
      <div class="modal-meta">
        <div><span class="muted">من:</span> <span id="mFrom">—</span></div>
        <div><span class="muted">التاريخ:</span> <span id="mDate">—</span></div>
      </div>
      <div id="mOtpBox" class="otp-box" hidden></div>
      <div id="mBody" class="modal-body">—</div>
      <div class="modal-foot">
        <button id="deleteMsgBtn" class="btn btn-sm btn-danger">حذف الرسالة</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <button id="closeSettings" class="icon-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="modal-title">الإعدادات</div>
      </div>
      <label class="field">
        <span>خادم مخصص (اختياري)</span>
        <input id="customServer" type="url" placeholder="https://..." />
      </label>
      <div class="muted small">الإصدار <span id="settingsVersion">—</span></div>
      <div class="modal-foot">
        <button id="saveSettings" class="btn btn-primary">حفظ</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
